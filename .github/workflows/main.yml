name: Windows exe derle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derleme bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Exe derle
        run: pyinstaller OyunlarimRemote.spec

      - name: Exe'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: OyunlarimRemote
          path: dist/OyunlarimRemote.exe

      - name: Etiketlendiyse Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OyunlarimRemote.exe
          generate_release_notes: true
